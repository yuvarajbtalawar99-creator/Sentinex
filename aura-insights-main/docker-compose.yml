version: '3.8'

services:
  # Python ML Microservice
  ml-service:
    build: ./ml-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - WORKERS=2
    restart: always

  # Node.js Backend API
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ML_SERVICE_URL=http://ml-service:8080
    restart: always
    depends_on:
      - ml-service

  # React Frontend (Nginx)
  frontend:
    build: .
    ports:
      - "80:80"
    restart: always
    depends_on:
      - server
